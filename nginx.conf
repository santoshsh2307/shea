# Reverse proxy for Blue-Green deployment

upstream backend_blue {
    server backend-blue:8080;
}

upstream backend_green {
    server backend-green:8080;
}

upstream frontend_blue {
    server frontend-blue:80;
}

upstream frontend_green {
    server frontend-green:80;
}

# Map to store active environment (blue or green)
# Default to blue on startup
map $http_x_version {
    default "blue";
    "green" "green";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Root path - route to active frontend
    location / {
        set $active_frontend "frontend_blue";
        
        # Check environment file for active version
        if (-f /app/active_env.txt) {
            set $active_env "$(cat /app/active_env.txt)";
            set $active_frontend "frontend_$active_env";
        }
        
        proxy_pass http://$active_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes - route to active backend
    location /api/ {
        set $active_backend "backend_blue";
        
        # Check environment file for active version
        if (-f /app/active_env.txt) {
            set $active_env "$(cat /app/active_env.txt)";
            set $active_backend "backend_$active_env";
        }
        
        proxy_pass http://$active_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /health {
        set $active_backend "backend_blue";
        
        if (-f /app/active_env.txt) {
            set $active_env "$(cat /app/active_env.txt)";
            set $active_backend "backend_$active_env";
        }
        
        proxy_pass http://$active_backend/health;
        access_log off;
    }

    # Actuator endpoints
    location /actuator/ {
        set $active_backend "backend_blue";
        
        if (-f /app/active_env.txt) {
            set $active_env "$(cat /app/active_env.txt)";
            set $active_backend "backend_$active_env";
        }
        
        proxy_pass http://$active_backend/actuator/;
    }
}

server {
    listen 8000;
    server_name _;

    # Admin interface to switch between blue and green
    location /admin/switch {
        default_type text/plain;
        return 200 "Use deployment script to switch versions\n";
    }

    location / {
        default_type text/html;
        return 200 "<h1>Admin Panel</h1><p>Current active version stored in: /app/active_env.txt</p>";
    }
}
