name: Deploy Frontend to Railway

on:
  push:
    branches: [ main ]
    paths:
      - 'enterprise-ui/**'
      - 'Dockerfile.frontend'
      - 'nginx.conf'
      - 'railway.json'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment name (optional)'
        required: false

jobs:
  deploy:
    name: Deploy frontend to Railway
    runs-on: ubuntu-latest
    concurrency:
      group: railway-frontend-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Validate required secrets
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "${RAILWAY_API_KEY}" ]; then
            echo "Missing RAILWAY_API_KEY secret"; exit 1
          fi
          if [ -z "${RAILWAY_PROJECT_ID}" ]; then
            echo "Missing RAILWAY_PROJECT_ID secret"; exit 1
          fi
          if [ -z "${RAILWAY_SERVICE_ID}" ]; then
            echo "Missing RAILWAY_SERVICE_ID secret"; exit 1
          fi

      - name: Login to Railway
        env:
          RAILWAY_API_KEY: ${{ secrets.RAILWAY_API_KEY }}
        run: |
          railway login --apiKey "${RAILWAY_API_KEY}"

      - name: Link Railway project/service
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway link --project "${RAILWAY_PROJECT_ID}" --service "${RAILWAY_SERVICE_ID}"

      - name: Deploy frontend
        env:
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          railway up --detach --yes --project "${RAILWAY_PROJECT_ID}" --service "${RAILWAY_SERVICE_ID}"
