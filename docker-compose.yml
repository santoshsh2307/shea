version: '3.8'

services:
  # Nginx Reverse Proxy - Entry point for all traffic
  nginx:
    image: nginx:alpine
    container_name: enterprise-nginx
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_shared:/app
    depends_on:
      - backend-blue
      - backend-green
      - frontend-blue
      - frontend-green
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ============ BACKEND SERVICES ============
  
  # Backend Blue Instance
  backend-blue:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise-backend-blue
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "8081:8080"
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - mysql

  # Backend Green Instance (initially scaled to 0)
  backend-green:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enterprise-backend-green
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - SERVER_PORT=8080
      - JAVA_OPTS=-Xmx512m -Xms256m
    ports:
      - "8082:8080"
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - mysql
    profiles:
      - green

  # ============ FRONTEND SERVICES ============

  # Frontend Blue Instance
  frontend-blue:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise-frontend-blue
    ports:
      - "3001:80"
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Green Instance (initially scaled to 0)
  frontend-green:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enterprise-frontend-green
    ports:
      - "3002:80"
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles:
      - green

  # ============ DATABASE ============

  mysql:
    image: mysql:8.0
    container_name: enterprise-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: enterprise_db
      MYSQL_USER: enterprise_user
      MYSQL_PASSWORD: enterprise_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - enterprise-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
  nginx_shared:
    driver: local

networks:
  enterprise-network:
    driver: bridge
